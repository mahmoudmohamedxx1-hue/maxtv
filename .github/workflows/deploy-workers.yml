name: Deploy to Cloudflare Workers

# Auto-deploy the Workers data plane on every push to main.
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare dashboard → My Profile → API Tokens
#                            → "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard → any domain → Overview →
#                            right sidebar "Account ID"
# Until both secrets exist this workflow exits gracefully (green, skipped).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set — skipping Workers deploy. Add them in Settings → Secrets and variables → Actions to enable auto-deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.skip == 'false'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.secrets.outputs.skip == 'false'
        run: npm ci

      - name: Build + deploy Worker
        if: steps.secrets.outputs.skip == 'false'
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
